<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>기년회에 초대합니다</title>
<meta property="og:title" content="기년회에 초대합니다" />
<meta property="og:description" content="한 해를 잊지 않고, 기억하는 자리. 봉투를 열어 주세요." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg1: #0f1a2b;
    --bg2: #1d2f4a;
    --paper: #fbf6ec;
    --ink: #2b2420;
    --gold: #c9a24a;
    --gold-light: #e8cd86;
    --red: #9e2b2b;
    --red-dark: #6f1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Gowun Batang", serif;
    color: var(--ink);
    background: radial-gradient(ellipse at 50% 30%, var(--bg2), var(--bg1) 70%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  #snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

  .stage {
    position: relative;
    z-index: 1;
    width: min(92vw, 420px);
    height: min(80vh, 620px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    perspective: 1200px;
  }

  /* ---------- Envelope ---------- */
  .envelope {
    position: absolute;
    bottom: 0;
    width: 100%;
    aspect-ratio: 1.45 / 1;
    cursor: pointer;
    transition: transform .9s cubic-bezier(.6,.1,.3,1), opacity .6s ease;
  }
  .envelope:hover:not(.open) { transform: translateY(-6px) rotate(-1deg); }
  .env-back, .env-front, .env-flap { position: absolute; inset: 0; }
  .env-back {
    background: linear-gradient(160deg, var(--red), var(--red-dark));
    border-radius: 6px;
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
  }
  .env-front {
    z-index: 3;
    background:
      linear-gradient(to top right, transparent 49.6%, #8a2424 50%) left/50.2% 100% no-repeat,
      linear-gradient(to top left, transparent 49.6%, #8a2424 50%) right/50.2% 100% no-repeat;
    clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
    background-color: #a83232;
    border-radius: 0 0 6px 6px;
  }
  .env-front::after {
    content: "To. 1년동안 고생한 당신께";
    position: absolute;
    bottom: 14%;
    width: 100%;
    text-align: center;
    color: var(--gold-light);
    font-size: clamp(13px, 3.6vw, 16px);
    letter-spacing: .15em;
    opacity: .9;
  }
  .env-flap {
    z-index: 4;
    height: 58%;
    background: linear-gradient(180deg, #b23838, #8e2727);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform .7s cubic-bezier(.6,.1,.3,1), z-index 0s .35s;
    border-radius: 6px 6px 0 0;
  }
  .seal {
    position: absolute;
    z-index: 5;
    left: 50%;
    top: 58%;
    width: 64px; height: 64px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--gold-light), var(--gold) 55%, #8d6c22);
    box-shadow: 0 4px 10px rgba(0,0,0,.4), inset 0 -3px 6px rgba(0,0,0,.25);
    display: grid;
    place-items: center;
    font-family: "Nanum Myeongjo", serif;
    font-weight: 800;
    font-size: 26px;
    color: #6b4f12;
    transition: transform .5s ease, opacity .4s ease;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 4px 10px rgba(0,0,0,.4), 0 0 0 0 rgba(232,205,134,.55); }
    50%     { box-shadow: 0 4px 10px rgba(0,0,0,.4), 0 0 0 14px rgba(232,205,134,0); }
  }
  .hint {
    position: absolute;
    bottom: -44px;
    width: 100%;
    text-align: center;
    color: var(--gold-light);
    font-size: 14px;
    letter-spacing: .2em;
    animation: blink 1.8s ease-in-out infinite;
    transition: opacity .3s;
  }
  @keyframes blink { 50% { opacity: .35; } }

  .envelope.open .env-flap { transform: rotateX(180deg); z-index: 0; }
  .envelope.open .seal { transform: translate(-50%, -50%) scale(0); opacity: 0; animation: none; }
  .envelope.open .hint { opacity: 0; }
  .envelope.gone { transform: translateY(120%); opacity: 0; pointer-events: none; }

  /* ---------- Card ---------- */
  .card-wrap {
    position: absolute;
    bottom: 4%;
    width: 92%;
    z-index: 2;
    transform: translateY(0) scale(.9);
    opacity: 0;
    transition: transform 1s cubic-bezier(.3,1.3,.5,1), opacity .5s ease, bottom 1s cubic-bezier(.3,1.3,.5,1);
    pointer-events: none;
  }
  .card-wrap.rise { opacity: 1; transform: translateY(-38%) scale(.95); }
  .card-wrap.center {
    bottom: 50%;
    width: 100%;
    transform: translateY(50%) scale(1);
    pointer-events: auto;
    z-index: 10;
  }
  .card {
    position: relative;
    background: var(--paper);
    border-radius: 10px;
    padding: clamp(26px, 7vw, 40px) clamp(22px, 6vw, 34px);
    box-shadow: 0 30px 70px rgba(0,0,0,.5);
    text-align: center;
    transform-style: preserve-3d;
    transition: transform .15s ease-out;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(201,162,74,.08), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(158,43,43,.06), transparent 40%);
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid var(--gold);
    border-radius: 6px;
    pointer-events: none;
  }
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.55) 48%, transparent 62%);
    background-size: 250% 100%;
    background-position: var(--shine, 120%) 0;
    pointer-events: none;
    mix-blend-mode: soft-light;
  }
  .ornament { color: var(--gold); font-size: 18px; letter-spacing: .5em; }
  .eyebrow {
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: .35em;
    color: var(--red);
  }
  h1 {
    font-family: "Nanum Myeongjo", serif;
    font-weight: 800;
    font-size: clamp(40px, 13vw, 58px);
    margin: 10px 0 4px;
    letter-spacing: .08em;
    background: linear-gradient(90deg, var(--red-dark), var(--red), var(--gold), var(--red));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: sheen 6s linear infinite;
  }
  @keyframes sheen { to { background-position: 300% 0; } }
  .hanja { font-size: 13px; color: #8a7a66; letter-spacing: .3em; }
  .msg {
    margin: 22px 0;
    font-size: clamp(14px, 3.8vw, 16px);
    line-height: 1.9;
    word-break: keep-all;
  }
  .msg b { color: var(--red); }
  .info {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 14px;
    text-align: left;
    margin: 0 auto;
    width: fit-content;
    font-size: 14px;
  }
  .info dt { color: var(--gold); font-weight: 700; letter-spacing: .15em; }
  .countdown {
    margin: 22px 0 18px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .cd-box {
    min-width: 56px;
    padding: 8px 4px 6px;
    border-radius: 8px;
    background: var(--ink);
    color: var(--gold-light);
  }
  .cd-box span { display: block; font-family: "Nanum Myeongjo", serif; font-size: 22px; font-weight: 800; }
  .cd-box small { font-size: 10px; letter-spacing: .2em; opacity: .7; }
  .rsvp {
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .15em;
    padding: 12px 26px;
    border-radius: 999px;
    border: none;
    color: var(--paper);
    background: linear-gradient(135deg, var(--red), var(--red-dark));
    box-shadow: 0 6px 16px rgba(158,43,43,.4);
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, background .4s;
  }
  .rsvp:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(158,43,43,.5); }
  .rsvp:active { transform: scale(.96); }
  .rsvp.done { background: linear-gradient(135deg, var(--gold), #9c7a2a); box-shadow: 0 6px 16px rgba(201,162,74,.45); }
  .footnote { margin-top: 14px; font-size: 12px; color: #8a7a66; min-height: 1.2em; }

  .replay {
    position: fixed;
    bottom: 18px; right: 18px;
    z-index: 60;
    font-family: inherit;
    font-size: 12px;
    color: var(--gold-light);
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(232,205,134,.35);
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s;
  }
  .replay.show { opacity: 1; pointer-events: auto; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<canvas id="snow"></canvas>
<canvas id="confetti"></canvas>

<main class="stage">
  <div class="card-wrap" id="cardWrap">
    <article class="card" id="card">
      <div class="ornament">✦ ✦ ✦</div>
      <p class="eyebrow">INVITATION · 2026</p>
      <h1>기년회</h1>
      <p class="hanja">記 年 會</p>

      <p class="msg">
        한 해를 <b>잊는</b> 대신,<br />
        한 해를 <b>기억하는</b> 자리를 마련했습니다.<br />
        올해 함께한 순간들을 나누러<br />
        와 주세요.
      </p>

      <!-- ✏️ 날짜·장소는 여기서 수정하세요 (아래 EVENT_DATE도 함께) -->
      <dl class="info">
        <dt>일시</dt><dd>2026년 12월 20일 (일) 오후 1시</dd>
        <dt>장소</dt><dd>추후 공지</dd>
        <dt>준비물</dt><dd>올해 기억하고 싶은 한 장면</dd>
      </dl>

      <div class="countdown" id="countdown" aria-label="행사까지 남은 시간">
        <div class="cd-box"><span id="cd-d">--</span><small>DAYS</small></div>
        <div class="cd-box"><span id="cd-h">--</span><small>HRS</small></div>
        <div class="cd-box"><span id="cd-m">--</span><small>MIN</small></div>
        <div class="cd-box"><span id="cd-s">--</span><small>SEC</small></div>
      </div>

      <button class="rsvp" id="rsvp">참석할게요 🥂</button>
      <p class="footnote" id="footnote"></p>
    </article>
  </div>

  <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="봉투 열기">
    <div class="env-back"></div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="seal">記</div>
    <p class="hint">봉투를 눌러 열어보세요</p>
  </div>
</main>

<button class="replay" id="replay">↺ 다시 보기</button>

<script>
  // ✏️ 행사 일시 (카운트다운 기준)
  const EVENT_DATE = new Date("2026-12-20T13:00:00+09:00");

  const $ = (id) => document.getElementById(id);
  const envelope = $("envelope"), cardWrap = $("cardWrap"), card = $("card");
  const rsvp = $("rsvp"), footnote = $("footnote"), replay = $("replay");

  /* ---------- Envelope open sequence ---------- */
  let opened = false;
  function openEnvelope() {
    if (opened) return;
    opened = true;
    envelope.classList.add("open");
    setTimeout(() => cardWrap.classList.add("rise"), 550);
    setTimeout(() => { envelope.classList.add("gone"); cardWrap.classList.add("center"); }, 1500);
    setTimeout(() => { burst(window.innerWidth / 2, window.innerHeight * 0.35, 90); replay.classList.add("show"); }, 2200);
  }
  envelope.addEventListener("click", openEnvelope);
  envelope.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEnvelope(); } });

  replay.addEventListener("click", () => {
    replay.classList.remove("show");
    cardWrap.classList.remove("center", "rise");
    envelope.classList.remove("gone", "open");
    card.style.transform = "";
    setTimeout(() => { opened = false; }, 900);
  });

  /* ---------- Card 3D tilt (mouse + gyro) ---------- */
  function tilt(nx, ny) {
    if (!cardWrap.classList.contains("center")) return;
    card.style.transform = `rotateY(${nx * 10}deg) rotateX(${-ny * 10}deg)`;
    card.style.setProperty("--shine", `${120 - (nx + 1) * 70}%`);
  }
  window.addEventListener("mousemove", (e) => {
    tilt((e.clientX / innerWidth) * 2 - 1, (e.clientY / innerHeight) * 2 - 1);
  });
  window.addEventListener("mouseleave", () => { card.style.transform = ""; });
  window.addEventListener("deviceorientation", (e) => {
    if (e.gamma == null) return;
    tilt(Math.max(-1, Math.min(1, e.gamma / 30)), Math.max(-1, Math.min(1, (e.beta - 45) / 30)));
  });

  /* ---------- Countdown ---------- */
  const pad = (n) => String(n).padStart(2, "0");
  function tick() {
    let diff = Math.max(0, EVENT_DATE - Date.now());
    const d = Math.floor(diff / 864e5); diff %= 864e5;
    const h = Math.floor(diff / 36e5);  diff %= 36e5;
    const m = Math.floor(diff / 6e4);   diff %= 6e4;
    const s = Math.floor(diff / 1e3);
    $("cd-d").textContent = d; $("cd-h").textContent = pad(h);
    $("cd-m").textContent = pad(m); $("cd-s").textContent = pad(s);
  }
  tick(); setInterval(tick, 1000);

  /* ---------- RSVP ---------- */
  const lines = [
    "좋아요! 올해의 한 장면, 꼭 챙겨 오세요 ✨",
    "한 번 더 누르셨네요. 진심 확인 완료 🙌",
    "이 정도면 개근상 후보입니다 🏅",
    "알겠어요, 알겠어요. 자리 제일 좋은 데로 잡아둘게요 😄",
  ];
  let clicks = 0;
  rsvp.addEventListener("click", (e) => {
    const r = rsvp.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top, 70 + clicks * 25);
    rsvp.classList.add("done");
    rsvp.textContent = "기억할게요, 그날 봬요 🎉";
    footnote.textContent = lines[Math.min(clicks, lines.length - 1)];
    clicks++;
  });

  /* ---------- Snow ---------- */
  const snow = $("snow"), sctx = snow.getContext("2d");
  const cf = $("confetti"), cctx = cf.getContext("2d");
  let flakes = [];
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    for (const [c, x] of [[snow, sctx], [cf, cctx]]) {
      c.width = innerWidth * dpr; c.height = innerHeight * dpr;
      c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px";
      x.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    const n = Math.round(Math.min(140, innerWidth / 8));
    flakes = Array.from({ length: n }, () => ({
      x: Math.random() * innerWidth, y: Math.random() * innerHeight,
      r: Math.random() * 2.2 + .6, v: Math.random() * .6 + .3,
      w: Math.random() * Math.PI * 2, o: Math.random() * .5 + .3,
    }));
  }
  resize(); addEventListener("resize", resize);

  /* ---------- Confetti ---------- */
  const colors = ["#c9a24a", "#e8cd86", "#9e2b2b", "#fbf6ec", "#d65a5a"];
  let pieces = [];
  function burst(x, y, count) {
    for (let i = 0; i < count; i++) {
      const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.1;
      const sp = Math.random() * 9 + 5;
      pieces.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        w: Math.random() * 6 + 4, h: Math.random() * 10 + 5,
        rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
        c: colors[(Math.random() * colors.length) | 0], life: 1,
      });
    }
  }

  function loop() {
    sctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const f of flakes) {
      f.w += .01; f.y += f.v; f.x += Math.sin(f.w) * .4;
      if (f.y > innerHeight + 5) { f.y = -5; f.x = Math.random() * innerWidth; }
      sctx.beginPath();
      sctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      sctx.fillStyle = `rgba(255,255,255,${f.o})`;
      sctx.fill();
    }

    cctx.clearRect(0, 0, innerWidth, innerHeight);
    pieces = pieces.filter((p) => p.life > 0 && p.y < innerHeight + 30);
    for (const p of pieces) {
      p.vy += .25; p.vx *= .985; p.x += p.vx; p.y += p.vy;
      p.rot += p.vr; p.life -= .006;
      cctx.save();
      cctx.translate(p.x, p.y); cctx.rotate(p.rot);
      cctx.globalAlpha = Math.max(0, p.life);
      cctx.fillStyle = p.c;
      cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 2)));
      cctx.restore();
    }
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
